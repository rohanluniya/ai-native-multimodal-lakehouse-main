repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: .venv/bin/ruff check .
        language: system
        pass_filenames: false
      - id: mypy
        name: mypy typecheck
        entry: .venv/bin/mypy multimodal_lakehouse
        language: system
        pass_filenames: false
