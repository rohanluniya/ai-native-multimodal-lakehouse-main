# AI-Native Multimodal Data Lakehouse & RAG Platform — Distributed Stack (Pinned Multi-Arch Releases)

services:
  kafka:
    image: apache/kafka:4.3.2
    container_name: mm-kafka
    profiles: ["core", "analytics", "full"]
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    volumes: [kafka_data:/tmp/kraft-combined-logs]

  qdrant:
    image: qdrant/qdrant:v1.20.2-unprivileged
    container_name: mm-qdrant
    profiles: ["core", "full"]
    ports: ["6333:6333", "6334:6334"]
    volumes: [qdrant_data:/qdrant/storage]

  opensearch:
    image: opensearchproject/opensearch:3.9.0
    container_name: mm-opensearch
    profiles: ["core", "full"]
    ports: ["9200:9200"]
    environment:
      discovery.type: single-node
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_INITIAL_ADMIN_PASSWORD:-ChangeMe_StrongP@ss2026!}
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes: [opensearch_data:/usr/share/opensearch/data]

  tika:
    image: apache/tika:3.4.0.0-full
    container_name: mm-tika
    profiles: ["core", "full"]
    ports: ["9998:9998"]

  rustfs:
    image: rustfs/rustfs:1.0.6
    container_name: mm-rustfs
    profiles: ["core", "analytics", "full"]
    ports: ["9000:9000", "9001:9001"]
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:-multimodal_s3_key}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:-multimodal_s3_secret_change_me}
    volumes: [rustfs_data:/data]

  postgres:
    image: imresamu/postgis:17-3.6.1-alpine3.23
    container_name: mm-postgres
    profiles: ["core", "analytics", "full"]
    ports: ["5432:5432"]
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=6", "-c", "max_wal_senders=6"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-multimodal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-multimodal_dev_pass}
      POSTGRES_DB: ${POSTGRES_DB:-multimodal_catalog}
    volumes:
      - ./ingestion/cdc/01_multimodal_ops_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - pg_data:/var/lib/postgresql/data

  lakekeeper:
    image: quay.io/lakekeeper/catalog:v0.15.1
    container_name: mm-lakekeeper
    profiles: ["core", "analytics", "full"]
    ports: ["8181:8181"]
    environment:
      LAKEKEEPER__PG_DATABASE_URL_READ: postgresql://${POSTGRES_USER:-multimodal}:${POSTGRES_PASSWORD:-multimodal_dev_pass}@postgres:5432/${POSTGRES_DB:-multimodal_catalog}
      LAKEKEEPER__PG_DATABASE_URL_WRITE: postgresql://${POSTGRES_USER:-multimodal}:${POSTGRES_PASSWORD:-multimodal_dev_pass}@postgres:5432/${POSTGRES_DB:-multimodal_catalog}
      LAKEKEEPER__PG_ENCRYPTION_KEY: ${LAKEKEEPER_ENCRYPTION_KEY:-dev-local-encryption-key-change-me}

  debezium:
    image: quay.io/debezium/connect:3.7.1.Final
    container_name: mm-debezium
    profiles: ["analytics", "full"]
    ports: ["8083:8083"]
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: multimodal-cdc-group
      CONFIG_STORAGE_TOPIC: mm_connect_configs
      OFFSET_STORAGE_TOPIC: mm_connect_offsets
      STATUS_STORAGE_TOPIC: mm_connect_statuses

  spark:
    image: apache/spark:4.1.4-scala2.13-java17-python3-ubuntu
    container_name: mm-spark
    profiles: ["analytics", "full"]
    command: ["sleep", "infinity"]
    volumes: ["./processing/spark:/opt/multimodal/spark:ro"]

  trino:
    image: trinodb/trino:484
    container_name: mm-trino
    profiles: ["analytics", "full"]
    ports: ["8084:8080"]
    volumes: ["./infra/docker/trino/catalog:/etc/trino/catalog:ro"]

  airflow:
    image: apache/airflow:slim-3.4.0-python3.12
    container_name: mm-airflow
    profiles: ["analytics", "full"]
    ports: ["8085:8080"]
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    command: ["standalone"]
    volumes: ["./processing/airflow/dags:/opt/airflow/dags:ro"]

  prometheus:
    image: prom/prometheus:v3.16.0
    container_name: mm-prometheus
    profiles: ["observability", "full"]
    ports: ["9090:9090"]
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/observability/alerts.yml:/etc/prometheus/alerts.yml:ro

  loki:
    image: grafana/loki:3.6.22
    container_name: mm-loki
    profiles: ["observability", "full"]
    ports: ["3100:3100"]

  grafana:
    image: grafana/grafana:13.0.14
    container_name: mm-grafana
    profiles: ["observability", "full"]
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin_change_me}

  marquez:
    image: marquezproject/marquez:0.51.1
    platform: linux/amd64
    container_name: mm-marquez
    profiles: ["observability", "full"]
    ports: ["5000:5000", "5001:5001"]

  rag-api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.standalone
    container_name: mm-rag-api
    profiles: ["core", "full"]
    ports: ["${LAKEHOUSE_API_PORT:-8020}:8020"]

volumes:
  kafka_data:
  qdrant_data:
  opensearch_data:
  rustfs_data:
  pg_data:
